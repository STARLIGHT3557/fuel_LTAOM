world_frame: world
lidar_frame: uav1/lidar_link
# The simulation loads this project's p600_mid360.sdf.jinja, not PX4's model.
# T_body_sensor = T_body_livox * T_livox_ray; mounting pitch is 0.35 rad.
# x = 0.13 + 0.05*sin(0.35), z = 0.23 + 0.05*cos(0.35).
lidar_x: 0.1471448904
lidar_y: 0.0
lidar_z: 0.2769686356
lidar_roll: 0.0
lidar_pitch: 0.35
lidar_yaw: 0.0
min_range: 0.6
# Simulation mapping stream encodes a no-hit ray at the sensor's 40 m limit.
# These endpoints go to FUEL but are omitted from the RViz returns display.
no_return_range: 40.0
min_start_altitude: 0.8
data_timeout: 0.5
command_timeout: 0.5
planning_timeout: 10.0
# Match the existing SUPER integration: TRAJECTORY_ATTITUDE (9).
# Use 6 for PX4 position/velocity/acceleration setpoints instead.
move_mode: 9
