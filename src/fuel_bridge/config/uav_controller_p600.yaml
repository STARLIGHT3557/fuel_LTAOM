# geometric_controller_node 使用的 ROS 1/MAVROS 参数。
# 坐标系采用 ENU/FLU，与 MAVROS 的 local_position 和 setpoint_raw 话题一致。

fsm:
  direct_trajectory: true
  position_step: false

k_pos:
  x: 9.0
  y: 9.0
  z: 12.0
k_vel:
  x: 6.0
  y: 6.0
  z: 8.0

hover_percentage: 0.258
estimate_thrust: true
hover_suggest: true
hover_stable_tol: 0.005
hover_stable_secs: 3.0
max_a_fb: 8.0
gravity: 9.81

control_rate_hz: 100.0
feedback_timeout: 0.5
state_timeout: 2.0
timestamp_future_tolerance: 0.05 # 允许消息源时间戳最多超前本机时间 50 ms。
setpoint_topic: /uav_controller/trajectory_setpoint

print_tracking: true
print_period_ms: 500

# SLAM/里程计位姿可能是跳变的。超过 max_speed 的瞬时跳变会被拒绝（保持上一帧反馈），
# 若跳变持续超过 accept_after 秒则视为真实的重定位/换帧并接受。
feedback_guard:
  max_speed: 8.0
  margin: 0.5
  accept_after: 2.0

# 反馈源必须与 FUEL 规划所用里程计一致，否则两个估计器缓慢漂移会让位置环发散。
# simulation.launch 会按 odom_topic 自动覆盖以下两项（LTAOM 时切到 /ltaom/pose、/ltaom/velocity）；
# 这里的值仅作为单独运行控制器时的默认值。
pose_topic: /mavros/local_position/pose
velocity_topic: /mavros/local_position/velocity_local
