# geometric_controller_node 使用的 ROS 1/MAVROS 参数。
# 坐标系采用 ENU/FLU，与 MAVROS 的 local_position 和 setpoint_raw 话题一致。

fsm:
  direct_trajectory: true
  position_step: false

k_pos:
  x: 8.0
  y: 8.0
  z: 12.0
k_vel:
  x: 4.0
  y: 4.0
  z: 5.0

hover_percentage: 0.258
estimate_thrust: true
hover_suggest: true
hover_stable_tol: 0.005
hover_stable_secs: 3.0
max_a_fb: 8.0
gravity: 9.81

control_rate_hz: 100.0
feedback_timeout: 0.5
state_timeout: 2.0
timestamp_future_tolerance: 0.05 # 允许消息源时间戳最多超前本机时间 50 ms。
setpoint_topic: /uav_controller/trajectory_setpoint

print_tracking: true
print_period_ms: 500
