# FUEL mapping and exploration settings for MID360 point clouds.
# Frames come from fuel.launch; mounting extrinsics come from sensor_config.
sdf_map:
  resolution: 0.2
  obstacles_inflation: 0.6
  max_ray_length: 10.0
  ground_height: -1.0
  virtual_ceil_height: 3.5
map_ros:
  visualization_truncate_height: 3.5
  visualization_truncate_low: 0.0
  show_all_map: true
frontier:
  cluster_min: 30
  min_candidate_clearance: 0.5
  min_visib_num: 10
perception_utils:
  lidar_360: true
  lidar_min_elevation: -0.122173
  lidar_max_elevation: 0.907571
  max_dist: 10.0
  vis_dist: 2.0
