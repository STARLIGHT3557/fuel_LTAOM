# bridge 参数。坐标系由 fuel.launch 设置；实飞雷达外参由 prepare_realflight.py
# 从 Faster-LIO 配置生成（sensor_config），不在此填写。
min_range: 0.6         # 删除距离雷达原点小于此值的点（机架、桨叶），单位 m。
data_timeout: 0.5      # 点云、里程计和控制器状态的新鲜度要求，超时则请求悬停，单位 s。
command_timeout: 0.5   # 规划指令超过此时间未更新则请求悬停，单位 s。
planning_timeout: 10.0 # 任务开始后等待第一条规划指令的最长时间，单位 s。
reference_jump_limit: 0.75 # 飞机未跟随轨迹时，参考点离它超过此距离就不转发，等规划器从当前位置重新规划，单位 m。
