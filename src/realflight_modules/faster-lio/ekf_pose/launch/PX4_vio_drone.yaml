# EKF 参数：融合 MID360 内置 IMU（/livox/imu）与 LIO 里程计，输出 /mavros/vision_pose/pose。
# 平移未针对本机标定。
# tr_i 为输出机体原点在 EKF 所用 IMU 坐标系中的位置（m）；机体与 IMU 坐标轴对齐时，
# ekf_lidar.launch 中的 imu_trans_* 应填同一向量，并与 mid360.yaml 的 imu_body_T 对应。
Rr_i:       [1, 0, 0, 0]     #ekf bag     #[1, 0, 0, 0] #car   #quaterniod(w,x,y,z)
# tr_i:       [0.0, 0.0, 0.1] #ekf bag     #[0, 0, 0.]   #cars
tr_i:       [0.0, 0.0, 0.0] #ekf bag     #[0, 0, 0.]   #cars

# for /mavros/imu/data_raw: m/s^2, scale = 1
# scale_g:    1.00

# Livox 加速度单位为 g；当前 EKF 重力常数使用 9.8       rui
scale_g: 9.8
# IMU 到机体的旋转（雷达安装角度，当前绕 y 轴 15°），必须与 mid360.yaml 的 imu_body_R 一致。
# rotation_imu:  [ 1, 0, 0,
#                  0, 1, 0,
#                  0, 0, 1]

rotation_imu: [
    0.9659258263, 0,  0.2588190451,
    0,            1,  0,
   -0.2588190451, 0,  0.9659258263
]