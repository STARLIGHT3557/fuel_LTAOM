# MID360 built-in IMU; lidar pitched 15 degrees down toward the nose.
# Assumes lidar X points forward, Y left, Z up before the pitch rotation.
common:
    lid_topic: "/livox/lidar"
    imu_topic: "/livox/imu"
    time_sync_en: false
preprocess:
    lidar_type: 1
    scan_line: 4
    blind: 0.4
    time_scale: 1e-9
mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 360
    det_range: 100.0
    extrinsic_est_en: false
    # LiDAR -> internal IMU: p_I = R_IL * p_L + t_IL.
    extrinsic_T: [-0.011, -0.02329, 0.04412]
    extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
    # Body -> IMU rotation. Output orientation follows the aircraft axes.
    imu_body_R: [0.9659258262890683, 0, -0.25881904510252074,
                 0, 1, 0,
                 0.25881904510252074, 0, 0.9659258262890683]
    # NOT CALIBRATED: body origin temporarily coincides with MID360 IMU.
    # Replace with IMU-to-body-origin vector expressed in IMU coordinates.
    imu_body_T: [0.0, 0.0, 0.0]
publish:
    path_publish_en: true
    scan_publish_en: true
    dense_publish_en: false
    scan_bodyframe_pub_en: true
pcd_save:
    # Avoid accumulating an unlimited full-resolution cloud in flight.
    pcd_save_en: false
    interval: -1
feature_extract_enable: false
point_filter_num: 3
max_iteration: 3
filter_size_surf: 0.5
filter_size_map: 0.5
cube_side_length: 1000
ivox_grid_resolution: 0.5
ivox_nearby_type: 18
esti_plane_threshold: 0.1
